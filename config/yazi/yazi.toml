# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [ 2, 3, 4 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse    = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]

[preview]
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[tasks]
image_bound =[ 10000, 10000 ]

[opener]
edit = [
  { run = '${EDITOR:=nvim} "$@"', desc = "$EDITOR", block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$@"',                desc = "Open", for = "linux" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$0")"',            desc = "Reveal", for = "linux" },
]
extract = [
  { run = 'unar "$1"', orphan = true, desc = "Extract here", for = "unix" },
]
videos = [
  { run = 'mpv --geometry=1280x700 "$@"', orphan = true, for = "unix" },
  { run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
audios = [
  { run = 'amberol "$@"', orphan = true, for = "unix" }
]
image = [
  { run = 'ristretto "$@"',  desc = "ImageOpen", for = "linux" },
]

[open]
rules = [
  { mime = "image/*",         use = [ "image", "reveal" ] },
  { mime = "video/*",         use = [ "videos", "reveal" ] },
  { mime = "audio/*",         use = [ "audios", "reveal" ] },

  { mime = "application/zip",             use = ["extract"] },
  { mime = "application/7z-compressed",   use = ["extract"] },
  { mime = "application/rar",             use = ["extract"] },
  { mime = "application/tar.xz",          use = ["extract"] },
  { mime = "application/gzip",            use = ["extract"] },
  { mime = "application/x-bzip",          use = ["extract"] },
  { mime = "application/x-bzip2",         use = ["extract"] },
  { mime = "application/x-tar",           use = ["extract"] },
  { mime = "application/x-7z-compressed", use = ["extract"] },
  { mime = "application/x-rar",           use = ["extract"] },

  { mime = "text/*",             use = "edit" },
  { mime = "application/json",   use = "edit" },
  { mime = "inode/empty",        use = "edit" },

  { mime = "*",                  use = "open" }
]

[plugin]
prepend_fetchers=[
  { id  = "git", url = "*", run = "git" },
  { id  = "git", url = "*/", run = "git" },
  { id   = "mime", url  = "local://*", run  = "mime-ext.local", prio = "high" },
  { id   = "mime", url  = "remote://*", run  = "mime-ext.remote", prio = "high" },
]
